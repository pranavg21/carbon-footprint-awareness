<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarbonTrack — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #050a15;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container {
      max-width: 400px;
      background: rgba(10, 17, 40, 0.55);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(148, 163, 184, 0.08);
      border-radius: 20px;
      padding: 3rem 2rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.75rem; color: #34d399; }
    p { font-size: 0.875rem; color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: linear-gradient(135deg, #34d399, #a3e635);
      color: #050a15;
      font-weight: 700;
      font-size: 0.875rem;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <main class="container" role="main">
    <div class="icon" aria-hidden="true">🌿</div>
    <h1>You're Offline</h1>
    <p>
      CarbonTrack needs an internet connection to sync your eco-data.
      Your local data is safely stored and will sync when you reconnect.
    </p>
    <button onclick="window.location.reload()" type="button">
      Try Again
    </button>
  </main>
</body>
</html>
